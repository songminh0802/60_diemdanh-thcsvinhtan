<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tự Điểm Danh - THCS Vĩnh Tân</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; }
    .toast-enter { animation: toast-in-center 0.3s forwards; }
    @keyframes toast-in-center {
      from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid #ffffff;
      width: 1.2rem;
      height: 1.2rem;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: text-bottom;
      margin-right: 5px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex items-center justify-center">
      <div class="flex items-center space-x-2">
        <i class="fas fa-check-double text-2xl"></i>
        <h1 class="text-xl font-bold uppercase tracking-wider">Hệ Thống Điểm Danh</h1>
      </div>
    </div>
  </header>

    <!-- Giao diện Admin / Dashboard -->
    <div id="view-dashboard" class="bg-white rounded-xl shadow-lg border border-blue-200 p-5 mb-8 flex-1 flex flex-col animate-fade-in">


      <div class="flex items-center justify-between mb-4 border-b pb-3">
        <h2 class="text-lg font-bold text-blue-800 uppercase tracking-wider"><i class="fas fa-chart-pie mr-2"></i>Thống Kê Sĩ Số</h2>
        <button id="btn-refresh-dash" onclick="App.refreshDashboard(this)" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1.5 rounded-lg text-sm font-bold transition-colors flex items-center">
          <i class="fas fa-sync-alt mr-1"></i> Làm mới
        </button>
      </div>

      <!-- Chọn cuộc họp (Lịch sử) -->
      <div class="mb-4 bg-indigo-50 border border-indigo-100 rounded-xl p-3 shadow-inner">
         <label class="block text-xs font-semibold text-indigo-700 mb-1">Dữ liệu cuộc họp đang xem:</label>
         <select id="dash-history-select" onchange="App.onSelectHistory()" class="w-full border-2 border-indigo-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold bg-white text-indigo-900 cursor-pointer hover:bg-gray-50 transition-colors">
            <option value="current">Hôm nay (Theo Form Tự Điểm Danh)</option>
         </select>
      </div>

      <!-- Lọc theo tổ -->
      <div class="mb-4">
         <select id="dash-filter-to" onchange="App.renderDashboard()" class="w-full border-2 border-blue-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold bg-blue-50 text-blue-800 shadow-sm cursor-pointer hover:bg-blue-100 transition-colors">
            <option value="all">Hiển thị Tất cả Giáo viên</option>
            <!-- Options rendered from JS -->
         </select>
      </div>

      <!-- Thống kê theo Tổ chuyên môn -->
      <div class="bg-gray-50 rounded-xl p-4 border border-gray-200 mb-6">
        <div class="flex justify-between items-end mb-3 border-b border-gray-200 pb-2">
           <span class="text-xs font-bold text-gray-500 uppercase">Tổng số Giáo viên</span>
           <span id="dash-total" class="text-2xl font-black text-blue-700 leading-none">0</span>
        </div>
        <div id="dash-to-list" class="grid grid-cols-2 gap-2 text-sm">
           <!-- Render from JS -->
        </div>
      </div>

      <!-- Thống kê 4 ô -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-blue-50 rounded-xl p-3 border border-blue-200 text-center relative overflow-hidden shadow-inner flex flex-col justify-center">
          <div class="text-[10px] sm:text-xs font-bold text-blue-700 uppercase mb-1">Đã điểm danh</div>
          <div class="text-3xl font-black text-blue-600" id="dash-submitted">0</div>
        </div>
        <div class="bg-orange-50 rounded-xl p-3 border border-orange-200 text-center relative overflow-hidden shadow-inner flex flex-col justify-center">
          <div class="text-[10px] sm:text-xs font-bold text-orange-700 uppercase mb-1">Chưa thao tác</div>
          <div class="text-3xl font-black text-orange-600" id="dash-missing">0</div>
        </div>
        <div class="bg-green-50 rounded-xl p-3 border border-green-200 text-center relative overflow-hidden shadow-inner flex flex-col justify-center">
          <div class="text-[10px] sm:text-xs font-bold text-green-700 uppercase mb-1">Có mặt</div>
          <div class="text-3xl font-black text-green-600" id="dash-present">0</div>
        </div>
        <div class="bg-red-50 rounded-xl p-3 border border-red-200 text-center relative overflow-hidden shadow-inner flex flex-col justify-center">
          <div class="text-[10px] sm:text-xs font-bold text-red-700 uppercase mb-1">Vắng / Trễ</div>
          <div class="text-3xl font-black text-red-600" id="dash-absent">0</div>
        </div>
      </div>
      
      <!-- Nút Copy Báo cáo -->
      <div class="mb-6">
        <button onclick="App.copyReport()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center">
          <i class="far fa-copy mr-2 text-lg"></i> COPY BÁO CÁO CHUYỂN ZALO
        </button>
      </div>

      <!-- Progress Bar -->
      <div class="mb-6">
        <div class="flex justify-between text-xs font-bold text-gray-500 mb-1">
          <span>Tiến độ hoàn thành</span>
          <span id="dash-percent">0%</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3">
          <div id="dash-progress" class="bg-blue-500 h-3 rounded-full transition-all duration-1000" style="width: 0%"></div>
        </div>
      </div>

      <!-- Danh sách chi tiết -->
      <h3 class="text-sm font-bold text-gray-700 uppercase mb-3 bg-gray-100 p-2 rounded-lg"><i class="fas fa-exclamation-circle text-orange-500 mr-2"></i> Danh sách Chưa thao tác</h3>
      <div id="dash-missing-list" class="space-y-2 mb-6 max-h-48 overflow-y-auto">
        <!-- Render from JS -->
      </div>
      
      <h3 class="text-sm font-bold text-gray-700 uppercase mb-3 bg-gray-100 p-2 rounded-lg"><i class="fas fa-clipboard-list text-red-500 mr-2"></i> Danh sách Vắng / Trễ</h3>
      <div id="dash-late-list" class="space-y-2 max-h-48 overflow-y-auto">
        <!-- Render from JS -->
      </div>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-1/2 left-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none drop-shadow-2xl"></div>

  <!-- Bắt đầu Script -->
  <script>
    // ==========================================
    // CẤU HÌNH HỆ THỐNG
    const API_URL = "https://script.google.com/macros/s/AKfycbzbIY_wmZh2JUVNytBE3MjgSpvrorb4CjJK2PFvxli0Jta09JoKzq1Jy3QBzWY76ShB/exec";
    
    // TRẠNG THÁI ỨNG DỤNG (STATE)
    // ==========================================
    const App = {
      state: {
        giaoVien: [],
        diemDanh: {}, // { "maGV": { trangThai, ghiChu } }
        toChuyenMon: new Set(),
        historyList: [] // Lưu danh sách các cuộc họp
      },

      // ----------------------------------------
      // UI Utils
      // ----------------------------------------
      showToast: (message, type = 'success') => {
        const container = document.getElementById('toast-container');
        container.innerHTML = ''; 
        
        const toast = document.createElement('div');
        const colors = type === 'success' ? 'bg-green-600' : (type === 'error' ? 'bg-red-600' : 'bg-gray-800');
        const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle');
        
        toast.className = `toast-enter ${colors} text-white px-6 py-5 rounded-2xl shadow-2xl flex flex-col items-center justify-center space-y-3 text-center border-2 border-white/20`;
        toast.innerHTML = `<i class="fas ${icon} text-4xl mb-1"></i> <span class="font-bold text-lg leading-snug">${message}</span>`;
        container.appendChild(toast);
        
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translate(-50%, -50%) scale(0.9)';
          toast.style.transition = 'all 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 4000); 
      },

      escapeHtml: (unsafe) => {
        return (unsafe || "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      },

      // ----------------------------------------
      // API Calls
      // ----------------------------------------
      fetchAPI: async (action, method = 'GET', data = null) => {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000); 
        
        try {
          let url = `${API_URL}?action=${action}`;
          let options = { signal: controller.signal };
          if (method === 'POST') {
            options = {
              ...options,
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action, ...data })
            };
          }
          const response = await fetch(url, options);
          const contentType = response.headers.get("content-type");
          if (contentType && contentType.indexOf("text/html") !== -1) {
            throw new Error("Lỗi: GAS trả về HTML. Hãy kiểm tra lại quyền Deploy.");
          }
          const result = await response.json();
          if (!result.success) throw new Error(result.message);
          return result.data || result;
        } catch (error) {
          console.error("API Error:", error);
          if (error.name === 'AbortError') {
             throw new Error("Lỗi mạng: Hết thời gian chờ phản hồi từ máy chủ.");
          }
          throw error;
        } finally {
          clearTimeout(timeoutId);
        }
      },

      // ----------------------------------------
      // Dashboard Logic
      // ----------------------------------------
      renderDashboard: () => {
        const selectedDashTo = document.getElementById('dash-filter-to') ? document.getElementById('dash-filter-to').value : 'all';
        let allTeachers = App.state.giaoVien || [];
        
        if (selectedDashTo !== 'all') {
           allTeachers = allTeachers.filter(gv => gv.toChuyenMon === selectedDashTo);
        }

        // --- NEW LOGIC: Lọc tự động theo Nhóm phụ (Cột D) ---
        const historySelect = document.getElementById('dash-history-select');
        if (historySelect && historySelect.selectedIndex > -1) {
           const meetingName = historySelect.options[historySelect.selectedIndex].text.toLowerCase();
           
           // Trích xuất tất cả các từ khóa Nhóm phụ có trong Cột D của mọi GV
           let nhomPhuTags = new Set();
           (App.state.giaoVien || []).forEach(gv => {
               if (gv.nhomPhu) {
                   gv.nhomPhu.split(',').forEach(tag => {
                       const t = tag.trim().toLowerCase();
                       if (t.length > 2) nhomPhuTags.add(t);
                   });
               }
           });
           
           // Ưu tiên so sánh từ khóa dài trước (ví dụ: "Ban chấp hành Công đoàn" trước "Công đoàn")
           const sortedTags = Array.from(nhomPhuTags).sort((a, b) => b.length - a.length);
           let matchedTag = null;
           for (const tag of sortedTags) {
               if (meetingName.includes(tag)) {
                   matchedTag = tag;
                   break;
               }
           }
           
           // Nếu Tên cuộc họp có chứa một Nhóm phụ, ta tự động Lọc bỏ những người không thuộc Nhóm đó
           if (matchedTag) {
               allTeachers = allTeachers.filter(gv => gv.nhomPhu && gv.nhomPhu.toLowerCase().includes(matchedTag));
           }
        }

        const attendanceMap = App.state.diemDanh || {}; 
        
        let presentCount = 0;
        let absentLateCount = 0;
        let missingList = [];
        let absentLateList = [];
        let toCountMap = {}; 
        
        allTeachers.forEach(gv => {
           const id = gv.maGV || gv.hoTen;
           const ten = gv.hoTen || "Không rõ";
           const to = gv.toChuyenMon || "Không rõ";
           
           if (!toCountMap[to]) toCountMap[to] = 0;
           toCountMap[to]++;
           
           if (attendanceMap[id]) {
              const tt = attendanceMap[id].trangThai;
              if (tt === "Có mặt") {
                 presentCount++;
              } else {
                 absentLateCount++;
                 absentLateList.push({ten, to, tt, ghiChu: attendanceMap[id].ghiChu});
              }
           } else {
              missingList.push({ten, to});
           }
        });
        
        const total = allTeachers.length;
        const missingCount = missingList.length;
        const submittedCount = presentCount + absentLateCount;
        const percent = total > 0 ? Math.round((submittedCount / total) * 100) : 0;
        
        document.getElementById('dash-total').innerText = total;
        document.getElementById('dash-submitted').innerText = submittedCount;
        document.getElementById('dash-present').innerText = presentCount;
        document.getElementById('dash-absent').innerText = absentLateCount;
        document.getElementById('dash-missing').innerText = missingCount;
        
        // Lưu tạm vào state để dùng cho tính năng Copy Báo Cáo
        App.state.reportData = {
           missing: missingList,
           lateAbsent: absentLateList
        };
        
        document.getElementById('dash-percent').innerText = `${percent}%`;
        document.getElementById('dash-progress').style.width = `${percent}%`;
        
        const toListEl = document.getElementById('dash-to-list');
        if (toListEl) {
           let toHtml = '';
           Object.keys(toCountMap).sort().forEach(to => {
              toHtml += `
                <div class="flex justify-between items-center bg-white border border-gray-100 p-2 rounded-lg shadow-sm">
                   <span class="font-bold text-gray-600 truncate mr-2">${App.escapeHtml(to)}</span>
                   <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md font-black text-xs">${toCountMap[to]}</span>
                </div>
              `;
           });
           toListEl.innerHTML = toHtml;
        }
        
        const renderList = (arr, isMissing) => {
           if (arr.length === 0) return `<div class="text-sm text-gray-400 italic p-2">Không có dữ liệu.</div>`;
           return arr.map(item => `
             <div class="flex justify-between items-center p-2 border-b border-gray-100 last:border-0 text-sm">
               <div><span class="font-bold text-gray-700">${App.escapeHtml(item.ten)}</span> <span class="text-xs text-gray-400">(${App.escapeHtml(item.to)})</span></div>
               ${!isMissing ? `<span class="px-2 py-0.5 rounded text-xs font-bold ${item.tt === 'Đi trễ' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}">${App.escapeHtml(item.tt)} ${item.ghiChu ? '- ' + App.escapeHtml(item.ghiChu) : ''}</span>` : ''}
             </div>
           `).join('');
        };
        
        document.getElementById('dash-missing-list').innerHTML = renderList(missingList, true);
        document.getElementById('dash-late-list').innerHTML = renderList(absentLateList, false);
      },

      copyReport: () => {
        const selectEl = document.getElementById('dash-history-select');
        let reportTitle = "Không rõ cuộc họp";
        if (selectEl && selectEl.selectedIndex > -1) {
           reportTitle = selectEl.options[selectEl.selectedIndex].text;
        }

        const total = document.getElementById('dash-total').innerText;
        const submitted = document.getElementById('dash-submitted').innerText;
        const present = document.getElementById('dash-present').innerText;
        
        const rd = App.state.reportData || { missing: [], lateAbsent: [] };
        
        let reportText = `BÁO CÁO SĨ SỐ:\n📌 ${reportTitle.toUpperCase()}\n`;
        reportText += `▶ Tổng GV: ${total} | Đã Đ.Danh: ${submitted} | Có mặt: ${present}\n`;
        
        if (rd.lateAbsent.length > 0) {
           reportText += `\n🔴 VẮNG / TRỄ (${rd.lateAbsent.length}):\n`;
           rd.lateAbsent.forEach(item => {
              reportText += `- ${item.ten} (${item.tt}${item.ghiChu ? ': ' + item.ghiChu : ''})\n`;
           });
        }
        
        if (rd.missing.length > 0) {
           reportText += `\n🟡 CHƯA THAO TÁC (${rd.missing.length}):\n`;
           rd.missing.forEach(item => {
              reportText += `- ${item.ten} (${item.to})\n`;
           });
        }
        
        navigator.clipboard.writeText(reportText).then(() => {
           App.showToast("Đã copy báo cáo! Bạn có thể dán thẳng vào nhóm Zalo.", "success");
        }).catch(err => {
           console.error("Lỗi copy: ", err);
           App.showToast("Lỗi khi copy. Trình duyệt của bạn có thể chặn tính năng này.", "error");
        });
      },

      refreshDashboard: async (btnEl) => {
        const originalHtml = btnEl.innerHTML;
        btnEl.innerHTML = `<i class="fas fa-sync-alt fa-spin mr-1"></i>`;
        btnEl.disabled = true;
        btnEl.classList.add('opacity-50', 'cursor-not-allowed');
        
        try {
           const val = document.getElementById('dash-history-select').value;
           if (!val) {
               App.showToast("Vui lòng chọn 1 cuộc họp để xem", "error");
               return;
           }
           const res = await App.fetchAPI('getDiemDanhByCuocHop', 'POST', { maCuocHop: val });
           App.state.diemDanh = res.map;
           App.renderDashboard();
           App.showToast("Đã cập nhật dữ liệu sĩ số mới nhất!", "success");
        } catch(e) {
           console.error(e);
           App.showToast("Không thể làm mới dữ liệu!", "error");
        } finally {
           btnEl.innerHTML = originalHtml;
           btnEl.disabled = false;
           btnEl.classList.remove('opacity-50', 'cursor-not-allowed');
        }
      },

      loadHistory: async () => {
         try {
             const res = await App.fetchAPI('getLichSuCuocHop', 'POST', {});
             const select = document.getElementById('dash-history-select');
             let html = ``;
             
             if(res && res.length > 0) {
                 App.state.historyList = res;
                 res.forEach(ma => {
                     const parts = ma.split('_');
                     let text = ma;
                     if (parts.length >= 3) {
                         const dateParts = parts[1].split('-');
                         const dateStr = dateParts.length === 3 ? `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}` : parts[1];
                         const type = parts[2];
                         const extra = parts.slice(3).join(' ').trim();
                         text = `${dateStr} - ${type}${extra ? ` (${extra})` : ''}`;
                     }
                     html += `<option value="${ma}">${text}</option>`;
                 });
             } else {
                 html = `<option value="" disabled selected>Chưa có dữ liệu cuộc họp nào</option>`;
             }
             
             select.innerHTML = html;
             
             // Auto load the first meeting if available
             if (res && res.length > 0) {
                 App.onSelectHistory();
             }
         } catch(e) {
             console.error("Lỗi tải lịch sử", e);
             App.showToast("Không thể tải danh sách cuộc họp cũ", "error");
         }
      },

      onSelectHistory: async () => {
         const val = document.getElementById('dash-history-select').value;
         if (!val) return;
         
         const btn = document.getElementById('btn-refresh-dash');
         if(btn) btn.innerHTML = `<i class="fas fa-sync-alt fa-spin mr-1"></i>`;
         
         try {
             const res = await App.fetchAPI('getDiemDanhByCuocHop', 'POST', { maCuocHop: val });
             App.state.diemDanh = res.map;
             App.renderDashboard();
         } catch(e) {
             App.showToast("Lỗi tải dữ liệu điểm danh!", "error");
         } finally {
             if(btn) btn.innerHTML = `<i class="fas fa-sync-alt mr-1"></i> Làm mới`;
         }
      },

      init: async () => {
         // Ask for password
         let valid = false;
         while(!valid) {
             const pass = prompt("Vui lòng nhập mật khẩu Quản trị viên:");
             if (pass === "admin123") {
                 valid = true;
             } else if (pass === null) {
                 document.body.innerHTML = "<div class='p-10 text-center font-bold text-red-600'>Bạn đã hủy đăng nhập. Hãy F5 để thử lại!</div>";
                 return;
             } else {
                 alert("Mật khẩu không chính xác!");
             }
         }
        
        try {
          // Lấy danh sách GV
          App.state.giaoVien = await App.fetchAPI('getGiaoVien');
          App.state.toChuyenMon = new Set(App.state.giaoVien.map(gv => gv.toChuyenMon).filter(Boolean));
          
          // Đổ dữ liệu vào Dropdown Tổ
          let dashOpts = `<option value="all">Hiển thị Tất cả Giáo viên</option>`;
          Array.from(App.state.toChuyenMon).sort().forEach(to => {
            dashOpts += `<option value="${App.escapeHtml(to)}">${App.escapeHtml(to)}</option>`;
          });
          const dashFilterTo = document.getElementById('dash-filter-to');
          if (dashFilterTo) dashFilterTo.innerHTML = dashOpts;

          // Lấy danh sách lịch sử cuộc họp
          await App.loadHistory();

        } catch (error) {
          App.showToast("Không thể tải dữ liệu. Vui lòng F5 thử lại.", 'error');
        }
      }
    };

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });

  </script>
</body>
</html>
