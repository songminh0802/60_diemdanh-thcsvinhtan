<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tự Điểm Danh - THCS Vĩnh Tân</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; }
    .toast-enter { animation: toast-in-top 0.3s forwards; }
    @keyframes toast-in-top {
      from { transform: translate(-50%, -100%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid #ffffff;
      width: 1.2rem;
      height: 1.2rem;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: text-bottom;
      margin-right: 5px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow-md">
    <div class="container mx-auto px-4 py-4 flex items-center justify-center">
      <div class="flex items-center space-x-2">
        <i class="fas fa-check-double text-2xl"></i>
        <h1 class="text-xl font-bold uppercase tracking-wider">Hệ Thống Điểm Danh</h1>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container mx-auto px-4 mt-6 max-w-lg flex-1 flex flex-col" id="app-container">
    
    <!-- Bước 1: Thông tin cuộc họp -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 mb-4">
      <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3"><i class="far fa-calendar-alt mr-1"></i> Thông tin buổi họp</h2>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Ngày</label>
          <input type="date" id="inp-date" onchange="App.reloadAttendance()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium bg-gray-50">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Loại họp</label>
          <select id="inp-loai" onchange="App.reloadAttendance()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium bg-gray-50">
            <option value="Họp chi bộ">Họp chi bộ</option>
            <option value="Họp hội đồng">Họp hội đồng</option>
            <option value="Họp tổ">Họp tổ</option>
            <option value="Họp trung tâm">Họp trung tâm</option>
            <option value="Họp khác">Họp khác</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Cảnh báo Loading Tổng -->
    <div id="loading-overlay" class="hidden bg-white rounded-xl shadow-sm border border-blue-100 p-8 mb-4 text-center">
      <i class="fas fa-circle-notch fa-spin text-4xl text-blue-500 mb-3"></i>
      <p class="text-gray-500 font-medium">Đang tải dữ liệu, vui lòng chờ...</p>
    </div>

    <!-- Bước 2: Form Tự Điểm Danh -->
    <div id="self-service-form" class="bg-white rounded-xl shadow-lg border border-gray-200 p-5 flex-1 mb-6 flex flex-col">
      <h2 class="text-lg font-bold text-blue-700 mb-5 border-b pb-2"><i class="fas fa-user-check mr-2"></i>Chọn tên của bạn</h2>
      
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">1. Tổ chuyên môn</label>
          <select id="inp-filter-to" onchange="App.onSelectTo()" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-medium text-lg bg-white">
            <option value="" disabled selected>-- Chọn Tổ của bạn --</option>
            <!-- Options rendered via JS -->
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">2. Họ và Tên</label>
          <select id="inp-select-gv" onchange="App.onSelectGV()" disabled class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-medium text-lg bg-gray-100 disabled:opacity-60 transition-colors">
            <option value="" disabled selected>-- Chọn Tên của bạn --</option>
            <!-- Options rendered via JS -->
          </select>
        </div>
      </div>

      <!-- Khu vực hành động (Sẽ hiện ra khi chọn Tên) -->
      <div id="action-area" class="hidden flex-col items-center justify-center p-4 bg-gray-50 rounded-xl border border-gray-100 mt-auto">
        <div id="status-display" class="mb-4 text-center">
          <span class="text-sm text-gray-500">Trạng thái hiện tại:</span>
          <div id="status-text" class="text-lg font-bold text-gray-400 mt-1">Chưa điểm danh</div>
        </div>

        <div class="grid grid-cols-2 gap-3 w-full">
          <button onclick="App.submitAttendance('Có mặt', this)" class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition-all active:scale-95 text-xl flex items-center justify-center">
            <i class="fas fa-hand-paper mr-2"></i> CÓ MẶT
          </button>
          <button onclick="App.submitAttendance('Đi trễ', this)" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded-xl shadow transition-all active:scale-95">ĐI TRỄ</button>
          <button onclick="App.submitAttendance('Vắng phép', this)" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 rounded-xl shadow transition-all active:scale-95">VẮNG PHÉP</button>
          <button onclick="App.submitAttendance('Vắng KP', this)" class="col-span-2 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl shadow transition-all active:scale-95">VẮNG KHÔNG PHÉP</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-0 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 mt-4 w-11/12 max-w-sm pointer-events-none"></div>

  <!-- Bắt đầu Script -->
  <script>
    // ==========================================
    // CẤU HÌNH HỆ THỐNG
    // ==========================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwMlIUK1KLzZchh-lCGpFECrrbz7kmcUSi7HWlQASXaKZNY9PRnfIXfw76EvsQmp-I/exec"; 
    
    // ==========================================
    // TRẠNG THÁI ỨNG DỤNG (STATE)
    // ==========================================
    const App = {
      state: {
        giaoVien: [],
        diemDanh: {}, // { "maGV": { trangThai, ghiChu } }
        toChuyenMon: new Set()
      },

      // ----------------------------------------
      // UI Utils
      // ----------------------------------------
      showToast: (message, type = 'success') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const colors = type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : 'bg-gray-800');
        const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle');
        
        toast.className = `toast-enter ${colors} text-white px-5 py-4 rounded-xl shadow-2xl flex items-center space-x-3`;
        toast.innerHTML = `<i class="fas ${icon} text-xl"></i> <span class="font-bold text-base flex-1 text-center">${message}</span>`;
        container.appendChild(toast);
        
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 3000); 
      },

      escapeHtml: (unsafe) => {
        return (unsafe || "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      },

      setLoadingState: (isLoading) => {
        const overlay = document.getElementById('loading-overlay');
        const form = document.getElementById('self-service-form');
        
        if (isLoading) {
          overlay.classList.remove('hidden');
          form.classList.add('hidden');
        } else {
          overlay.classList.add('hidden');
          form.classList.remove('hidden');
        }
      },

      getCurrentMaCuocHop: () => {
        const dateRaw = document.getElementById('inp-date').value;
        const loai = document.getElementById('inp-loai').value;
        let dateFormatted = "Chưa rõ ngày";
        if (dateRaw) {
          const parts = dateRaw.split('-');
          if (parts.length === 3) dateFormatted = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return `${dateFormatted} - ${loai}`;
      },

      // ----------------------------------------
      // API Calls
      // ----------------------------------------
      fetchAPI: async (action, method = 'GET', data = null) => {
        try {
          let url = `${WEB_APP_URL}?action=${action}`;
          let options = {};
          if (method === 'POST') {
            options = {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action, ...data })
            };
          }
          const response = await fetch(url, options);
          const result = await response.json();
          if (!result.success) throw new Error(result.message);
          return result.data || result;
        } catch (error) {
          console.error("API Error:", error);
          throw error;
        }
      },

      // ----------------------------------------
      // Business Logic & Events
      // ----------------------------------------
      init: async () => {
        const today = new Date();
        document.getElementById('inp-date').value = today.toISOString().split('T')[0];
        
        App.setLoadingState(true);
        try {
          // Lấy danh sách GV
          App.state.giaoVien = await App.fetchAPI('getGiaoVien');
          App.state.toChuyenMon = new Set(App.state.giaoVien.map(gv => gv.toChuyenMon).filter(Boolean));
          
          // Đổ dữ liệu vào Dropdown Tổ
          const selTo = document.getElementById('inp-filter-to');
          let opts = `<option value="" disabled selected>-- Chọn Tổ của bạn --</option>`;
          Array.from(App.state.toChuyenMon).sort().forEach(to => {
            opts += `<option value="${App.escapeHtml(to)}">${App.escapeHtml(to)}</option>`;
          });
          selTo.innerHTML = opts;

          // Lấy dữ liệu điểm danh ngày hiện tại
          await App.loadAttendanceData();

        } catch (error) {
          App.showToast("Không thể tải dữ liệu. Vui lòng thử lại.", 'error');
        } finally {
          App.setLoadingState(false);
        }
      },

      loadAttendanceData: async () => {
        const maCuocHop = App.getCurrentMaCuocHop();
        try {
          const res = await App.fetchAPI('getDiemDanhByCuocHop', 'POST', { data: { maCuocHop } });
          App.state.diemDanh = res.data || {};
          // Cập nhật lại UI nếu đang có người được chọn
          App.updateStatusUI();
        } catch (e) {
          console.error(e);
        }
      },

      reloadAttendance: async () => {
        App.setLoadingState(true);
        await App.loadAttendanceData();
        // Reset lựa chọn khi đổi ngày/loại họp
        document.getElementById('inp-filter-to').value = "";
        document.getElementById('inp-select-gv').innerHTML = `<option value="" disabled selected>-- Chọn Tên của bạn --</option>`;
        document.getElementById('inp-select-gv').disabled = true;
        document.getElementById('inp-select-gv').classList.add('bg-gray-100');
        document.getElementById('action-area').classList.add('hidden');
        document.getElementById('action-area').classList.remove('flex');
        App.setLoadingState(false);
      },

      onSelectTo: () => {
        const selectedTo = document.getElementById('inp-filter-to').value;
        const selGV = document.getElementById('inp-select-gv');
        const actionArea = document.getElementById('action-area');
        
        // Ẩn khu vực bấm nút
        actionArea.classList.add('hidden');
        actionArea.classList.remove('flex');

        if (!selectedTo) {
          selGV.disabled = true;
          selGV.classList.add('bg-gray-100');
          selGV.innerHTML = `<option value="" disabled selected>-- Chọn Tên của bạn --</option>`;
          return;
        }

        // Lọc danh sách GV theo Tổ
        const gvList = App.state.giaoVien.filter(gv => gv.toChuyenMon === selectedTo);
        
        // Render vào dropdown
        let opts = `<option value="" disabled selected>-- Bấm để chọn Tên --</option>`;
        gvList.forEach(gv => {
          opts += `<option value="${App.escapeHtml(gv.maGV)}">${App.escapeHtml(gv.hoTen)}</option>`;
        });
        selGV.innerHTML = opts;
        
        // Bật dropdown
        selGV.disabled = false;
        selGV.classList.remove('bg-gray-100');
        selGV.classList.add('bg-white');
      },

      onSelectGV: () => {
        const maGV = document.getElementById('inp-select-gv').value;
        const actionArea = document.getElementById('action-area');
        
        if (!maGV) {
          actionArea.classList.add('hidden');
          actionArea.classList.remove('flex');
          return;
        }

        actionArea.classList.remove('hidden');
        actionArea.classList.add('flex');
        App.updateStatusUI();
      },

      updateStatusUI: () => {
        const maGV = document.getElementById('inp-select-gv').value;
        if (!maGV) return;

        const dd = App.state.diemDanh[maGV];
        const statusText = document.getElementById('status-text');
        
        if (dd && dd.trangThai) {
          let color = "text-green-600";
          let icon = "fa-check-circle";
          if (dd.trangThai === "Đi trễ") { color = "text-yellow-600"; icon = "fa-clock"; }
          if (dd.trangThai.includes("Vắng")) { color = "text-red-600"; icon = "fa-times-circle"; }
          
          statusText.innerHTML = `<span class="${color}"><i class="fas ${icon} mr-1"></i>Đã lưu: ${dd.trangThai}</span>`;
        } else {
          statusText.innerHTML = `<span class="text-gray-400">Chưa điểm danh</span>`;
        }
      },

      submitAttendance: async (trangThai, btnEl) => {
        const maGV = document.getElementById('inp-select-gv').value;
        const tenGV = document.getElementById('inp-select-gv').options[document.getElementById('inp-select-gv').selectedIndex].text;
        if (!maGV) return;

        const maCuocHop = App.getCurrentMaCuocHop();
        const originalHtml = btnEl.innerHTML;
        
        // Loading state trên nút
        btnEl.innerHTML = `<div class="spinner"></div> ĐANG LƯU...`;
        btnEl.disabled = true;
        btnEl.classList.add('opacity-80', 'cursor-not-allowed');

        try {
          await App.fetchAPI('saveDiemDanh', 'POST', {
            data: {
              maCuocHop: maCuocHop,
              maGV: maGV,
              trangThai: trangThai,
              ghiChu: ""
            }
          });
          
          // Cập nhật State
          if (!App.state.diemDanh[maGV]) App.state.diemDanh[maGV] = {};
          App.state.diemDanh[maGV].trangThai = trangThai;
          
          App.updateStatusUI();
          App.showToast(`Đã lưu ${trangThai.toUpperCase()} cho cô/thầy ${tenGV}!`, 'success');
          
          // Reset UI cho người tiếp theo (Optionally)
          setTimeout(() => {
            document.getElementById('inp-filter-to').value = "";
            App.onSelectTo(); // Triggers hide action area and reset GV dropdown
          }, 2000);

        } catch (error) {
          App.showToast("Có lỗi xảy ra, chưa lưu được!", 'error');
        } finally {
          btnEl.innerHTML = originalHtml;
          btnEl.disabled = false;
          btnEl.classList.remove('opacity-80', 'cursor-not-allowed');
        }
      }
    };

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });

  </script>
</body>
</html>
