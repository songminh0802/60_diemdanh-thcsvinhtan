<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm danh Nhanh - THCS Vĩnh Tân</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .toast-enter { animation: toast-in-right 0.3s; }
    @keyframes toast-in-right {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid #ffffff;
      width: 1.5rem;
      height: 1.5rem;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow-md sticky top-0 z-10">
    <div class="container mx-auto px-4 py-3 flex items-center justify-center">
      <div class="flex items-center space-x-3">
        <i class="fas fa-clipboard-check text-2xl"></i>
        <h1 class="text-xl font-bold truncate">Điểm danh Vĩnh Tân</h1>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container mx-auto px-4 mt-6 max-w-3xl" id="app-container">
    
    <!-- Thanh công cụ (Cấu hình cuộc họp) -->
    <div class="bg-white rounded-xl shadow-md p-4 mb-5 border-t-4 border-t-blue-500">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Ngày điểm danh</label>
          <input type="date" id="inp-date" onchange="App.reloadAttendance()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Loại cuộc họp</label>
          <select id="inp-loai" onchange="App.reloadAttendance()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium bg-white">
            <option value="Họp chi bộ">Họp chi bộ</option>
            <option value="Họp hội đồng">Họp hội đồng</option>
            <option value="Họp tổ">Họp tổ</option>
            <option value="Họp trung tâm">Họp trung tâm</option>
            <option value="Họp khác">Họp khác</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Bộ lọc Giáo viên -->
    <div class="flex space-x-2 mb-4">
      <div class="relative flex-1">
        <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
        <input type="text" id="inp-search-gv" placeholder="Tìm tên GV..." oninput="App.filterGiaoVien()" class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <select id="inp-filter-to" onchange="App.filterGiaoVien()" class="border border-gray-300 rounded-lg px-2 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
        <option value="ALL">Tất cả tổ</option>
        <!-- Sẽ render động options -->
      </select>
    </div>

    <!-- Danh sách giáo viên -->
    <div id="list-giaovien" class="space-y-3">
      <div class="text-center text-gray-500 py-10 bg-white rounded-lg shadow-sm border border-gray-100">
        <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
        <p>Đang tải dữ liệu giáo viên...</p>
      </div>
    </div>

  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

  <!-- Bắt đầu Script -->
  <script>
    // ==========================================
    // CẤU HÌNH HỆ THỐNG
    // ==========================================
    // TODO: THAY ĐỔI URL DƯỚI ĐÂY SAU KHI DEPLOY GAS WEB APP
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwMlIUK1KLzZchh-lCGpFECrrbz7kmcUSi7HWlQASXaKZNY9PRnfIXfw76EvsQmp-I/exec"; 
    
    // ==========================================
    // TRẠNG THÁI ỨNG DỤNG (STATE)
    // ==========================================
    const App = {
      state: {
        giaoVien: [],
        diemDanh: {}, // { "maGV": { trangThai, ghiChu } }
        toChuyenMon: new Set()
      },

      // ----------------------------------------
      // UI Utils
      // ----------------------------------------
      showToast: (message, type = 'success') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const colors = type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : 'bg-blue-500');
        const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle');
        
        toast.className = `toast-enter ${colors} text-white px-4 py-3 rounded shadow-lg flex items-center space-x-2`;
        toast.innerHTML = `<i class="fas ${icon}"></i> <span class="font-medium">${message}</span>`;
        container.appendChild(toast);
        
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 2000); // 2 giây thì tắt cho nhanh
      },

      escapeHtml: (unsafe) => {
        return (unsafe || "").toString()
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      },

      getCurrentMaCuocHop: () => {
        const dateRaw = document.getElementById('inp-date').value;
        const loai = document.getElementById('inp-loai').value;
        
        // Chuyển dateRaw (YYYY-MM-DD) thành DD/MM/YYYY
        let dateFormatted = "Chưa rõ ngày";
        if (dateRaw) {
          const parts = dateRaw.split('-');
          if (parts.length === 3) dateFormatted = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        
        return `${dateFormatted} - ${loai}`;
      },

      // ----------------------------------------
      // API Calls
      // ----------------------------------------
      fetchAPI: async (action, method = 'GET', data = null) => {
        try {
          if (WEB_APP_URL.includes('TEST_APP_ID')) {
             throw new Error("Vui lòng cập nhật WEB_APP_URL trong index.html");
          }
          
          let url = `${WEB_APP_URL}?action=${action}`;
          let options = {};
          
          if (method === 'POST') {
            options = {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action, ...data })
            };
          }
          
          const response = await fetch(url, options);
          const result = await response.json();
          if (!result.success) throw new Error(result.message);
          return result.data || result;
        } catch (error) {
          console.error("API Error:", error);
          App.showToast(error.message, 'error');
          throw error;
        }
      },

      // ----------------------------------------
      // Business Logic
      // ----------------------------------------
      init: async () => {
        // Set ngày mặc định là hôm nay
        const today = new Date();
        document.getElementById('inp-date').value = today.toISOString().split('T')[0];
        
        try {
          // Lấy danh sách giáo viên
          App.state.giaoVien = await App.fetchAPI('getGiaoVien');
          App.state.toChuyenMon = new Set(App.state.giaoVien.map(gv => gv.toChuyenMon).filter(Boolean));
          
          // Render filter Tổ chuyên môn
          const filterTo = document.getElementById('inp-filter-to');
          let opts = `<option value="ALL">Tất cả tổ</option>`;
          Array.from(App.state.toChuyenMon).sort().forEach(to => {
            opts += `<option value="${App.escapeHtml(to)}">${App.escapeHtml(to)}</option>`;
          });
          filterTo.innerHTML = opts;

          // Load trạng thái điểm danh hiện tại
          await App.reloadAttendance();

        } catch (error) {
          document.getElementById('list-giaovien').innerHTML = `<div class="text-center text-red-500 py-8 bg-white rounded-lg shadow-sm border border-gray-100"><i class="fas fa-exclamation-circle text-3xl mb-3"></i><p>Lỗi tải dữ liệu. Vui lòng tải lại trang.</p></div>`;
        }
      },

      reloadAttendance: async () => {
        const listEl = document.getElementById('list-giaovien');
        const maCuocHop = App.getCurrentMaCuocHop();
        
        // Disable actions tạm thời
        listEl.style.opacity = '0.5';
        listEl.style.pointerEvents = 'none';
        
        try {
          const diemDanhMapResult = await App.fetchAPI('getDiemDanhByCuocHop', 'POST', { data: { maCuocHop: maCuocHop } });
          App.state.diemDanh = diemDanhMapResult.data || {};
          App.renderGiaoVienList();
        } catch (error) {
          // Lỗi đã báo ở fetchAPI
        } finally {
          listEl.style.opacity = '1';
          listEl.style.pointerEvents = 'auto';
        }
      },

      filterGiaoVien: () => {
        App.renderGiaoVienList();
      },

      renderGiaoVienList: () => {
        const search = document.getElementById('inp-search-gv').value.toLowerCase();
        const to = document.getElementById('inp-filter-to').value;
        const listEl = document.getElementById('list-giaovien');
        
        let filtered = App.state.giaoVien.filter(gv => {
          const matchSearch = gv.hoTen.toLowerCase().includes(search);
          const matchTo = to === 'ALL' || gv.toChuyenMon === to;
          return matchSearch && matchTo;
        });

        if (filtered.length === 0) {
          listEl.innerHTML = `<div class="text-center text-gray-500 py-8 bg-white rounded-lg shadow-sm border border-gray-100">Không tìm thấy giáo viên.</div>`;
          return;
        }

        let html = '';
        filtered.forEach(gv => {
          const dd = App.state.diemDanh[gv.maGV] || {};
          const status = dd.trangThai || '';
          
          const btnActive = "bg-blue-600 text-white font-medium border-blue-600 shadow-inner";
          const btnInactive = "bg-white text-gray-600 font-medium border-gray-300 hover:bg-blue-50 active:bg-blue-100";
          
          html += `
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 transition duration-200" data-magv="${App.escapeHtml(gv.maGV)}">
              <div class="flex justify-between items-center mb-3">
                <div>
                  <h4 class="font-bold text-gray-800 text-lg">${App.escapeHtml(gv.hoTen)}</h4>
                  <span class="text-xs font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full inline-block mt-1">${App.escapeHtml(gv.toChuyenMon)}</span>
                </div>
                <div class="text-right">
                  <span class="text-sm transition-all duration-300 ${status ? 'text-green-600 font-bold' : 'text-gray-400'}">
                    ${status ? '<i class="fas fa-check-circle mr-1 text-lg align-text-bottom"></i>' : ''}${status || 'Chưa ĐD'}
                  </span>
                </div>
              </div>
              <div class="grid grid-cols-4 gap-2 actions-container mt-4">
                <button data-action="mark" data-status="Có mặt" class="border py-2 rounded-lg text-sm transition-all duration-200 ${status === 'Có mặt' ? btnActive : btnInactive}">Có mặt</button>
                <button data-action="mark" data-status="Đi trễ" class="border py-2 rounded-lg text-sm transition-all duration-200 ${status === 'Đi trễ' ? btnActive : btnInactive}">Đi trễ</button>
                <button data-action="mark" data-status="Vắng phép" class="border py-2 rounded-lg text-sm transition-all duration-200 ${status === 'Vắng phép' ? btnActive : btnInactive}">V phép</button>
                <button data-action="mark" data-status="Vắng KP" class="border py-2 rounded-lg text-sm transition-all duration-200 ${status === 'Vắng KP' ? btnActive : btnInactive}">Vắng KP</button>
              </div>
            </div>
          `;
        });
        listEl.innerHTML = html;
      },

      markAttendance: async (maGV, trangThai, buttonEl) => {
        const maCuocHop = App.getCurrentMaCuocHop();
        const container = buttonEl.closest('.actions-container');
        
        // Optimistic UI update
        container.querySelectorAll('button').forEach(b => {
           b.className = "border py-2 rounded-lg text-sm transition-all duration-200 bg-white text-gray-600 font-medium border-gray-300 hover:bg-blue-50 active:bg-blue-100";
        });
        buttonEl.className = "border py-2 rounded-lg text-sm transition-all duration-200 bg-blue-600 text-white font-medium border-blue-600 shadow-inner";
        
        // Update text status quickly
        const card = buttonEl.closest('.bg-white');
        const statusText = card.querySelector('.text-right span');
        statusText.className = "text-sm transition-all duration-300 text-green-600 font-bold";
        statusText.innerHTML = `<i class="fas fa-check-circle mr-1 text-lg align-text-bottom"></i>${trangThai}`;

        try {
          await App.fetchAPI('saveDiemDanh', 'POST', {
            data: {
              maCuocHop: maCuocHop,
              maGV: maGV,
              trangThai: trangThai,
              ghiChu: ""
            }
          });
          
          // Lưu vào state để rerender (khi search/filter) không bị mất
          if (!App.state.diemDanh[maGV]) App.state.diemDanh[maGV] = {};
          App.state.diemDanh[maGV].trangThai = trangThai;
          
          App.showToast(`Đã lưu: ${trangThai}`);

        } catch (error) {
           // Hoàn tác UI nếu lỗi
           App.renderGiaoVienList();
        }
      }
    };

    // ==========================================
    // EVENT DELEGATION
    // ==========================================
    document.getElementById('list-giaovien').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action="mark"]');
      if (btn) {
        const card = btn.closest('[data-magv]');
        if (card) {
          const maGV = card.dataset.magv;
          const status = btn.dataset.status;
          App.markAttendance(maGV, status, btn);
        }
      }
    });

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });

  </script>
</body>
</html>
